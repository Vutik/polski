          - paragraph [ref=e1455]:
            - text: То есть, если в настоящем времени в первом лице ед. числа (ja) есть буква «n» в конце (
            - emphasis [ref=e1457]: biegnę, ucieknę, legnę, polegnę, kradnę, rosnę, padnę
            - text: ) — она исчезнет в прошедшем времени. И эти нерегулярные глаголы — «на согласный +с» и на окончание «с». То есть, если вам попадается слово на согласный +с или на с, и в первом лице ед. числа настоящего времени у него есть …nę, можете смело спрягать по примерам выше. Что касается глагола rość, он спрягается как глагол móc или nieść в одном флаконе — появляется ó в ОN и в ONI основа из инфинитива. По факту глаголы móc или nieść/wieźć — тоже нерегулярные, но я уже о них написала раньше, так что зачем дублировать-то.
          - blockquote [ref=e1458]:
            - text: 💡
            - paragraph [ref=e1459]:
              - strong [ref=e1460]:
                - text: "Читайте также:"
                - 'link "Cпряжение глаголов в польском языке: таблица настоящего времени" [ref=e1461] [cursor=pointer]':
                  - /url: https://propolski.com/2015/12/16/koniugacja-czasownikow-polskich/
          - paragraph [ref=e1462]: Относительно спряжений в прошедшем времени кажется, что это все. Возможно, что я потеряла какой-то интересный пример из нерегулярных глаголов (потому что здесь, конечно, не все), но раз потеряла — значит, это было не так важно. Сами видите — здесь и так рассмотрено много таких глаголов, которыми вы не пользуетесь каждый день.
          - paragraph [ref=e1463]:
            - text: Как тренировать прошедшее время польского языка? Видите какой-либо глагол — в инфинитиве, уже в
            - link "форме настоящего времени" [ref=e1464] [cursor=pointer]:
              - /url: https://propolski.com/2015/12/16/koniugacja-czasownikow-polskich/
            - text: — попробуйте сделать про себя его в прошедшем. И проверьте свою правоту
            - link "Викисловарем" [ref=e1465] [cursor=pointer]:
              - /url: https://pl.wiktionary.org/
            - text: .
          - insertion [ref=e1466]
          - heading "Ударение в прошедшем времени польского языка" [level=2] [ref=e1468]: Ударение в прошедшем времени польского языка
          - paragraph [ref=e1469]:
            - text: Еще одна важная тема, относящаяся к прошедшему времени польского языка и о которой постоянно забывают, это
            - link "ударение" [ref=e1470] [cursor=pointer]:
              - /url: https://propolski.com/2016/11/11/polskie-akcentowanie/
            - text: . Да, вы знаете, и я знаю, что ударение стоит всегда на втором слоге с конца — и благодаря этому правилу польский уже кажется более привлекательным чем русский. Но «всегда» — это не всегда, а в большинстве случаев.
          - paragraph [ref=e1471]:
            - text: Одними из исключений являются глаголы прошедшего времени для лиц «мы — MY» и «вы — WY». Там
            - strong [ref=e1472]: ударение
            - text: стоит
            - strong [ref=e1473]: на третьем слоге с конца
            - text: .
          - paragraph [ref=e1474]:
            - text: То есть, читаем b
            - generic [ref=e1475]: "y"
            - text: liśmy, czyt
            - generic [ref=e1476]: a
            - text: liśmy, pis
            - generic [ref=e1477]: a
            - text: liśmy, br
            - generic [ref=e1478]: a
            - text: liście, ogląd
            - generic [ref=e1479]: a
            - text: liście, wzi
            - generic [ref=e1480]: ę
            - text: liśmy, kr
            - generic [ref=e1481]: a
            - text: dliście и т.д.
          - paragraph [ref=e1482]: Происходит это потому, что ударение — это своего рода выделение, подчеркивание чего-нибудь. И подчеркивать нужно важное, а не какое-то там «liśmy/liście», которое вообще никакой смысловой нагрузки не несет. Если подытожить, то ударение прошедшего времени в польском языке никогда не переходит границу буквы «ł» (или «l«), оно всегда будет до.
          - heading "Прошедшее время в предложении" [level=2] [ref=e1483]: Прошедшее время в предложении
          - paragraph [ref=e1484]: "Всё выше рассмотренное — это очень круто, конечно же, но кроме самого словообразования, еще важно поговорить об употреблении прошедшего времени в предложении, о его месте там. По привычке русскоязычной (и согласно примерам из учебников polskiego jako obcego) — всё супер-просто: Kiedy wyjechaliście? (когда вы выехали?). И можно так и оставить, так и говорить, так и писать. И ошибок совсем при этом не будет!"
          - paragraph [ref=e1485]: Но! Как всегда, есть «но». Вот эти вот окончания -m, -ś, -śmy, -ście прошедшего времени — они движимые. То есть, они могут «отрываться» от глагола и «приклеиваться» к другим членам предложения. Чаще всего это слышно в разговорной речи, но и в книгах, особенно в диалогах, это также вы найдете.
          - paragraph [ref=e1486]:
            - text: Если сказать чуть более по-научному, то глаголы прошедшего времени имеют движимые окончания-
            - link "энклитики" [ref=e1487] [cursor=pointer]:
              - /url: https://ru.wikipedia.org/wiki/%D0%AD%D0%BD%D0%BA%D0%BB%D0%B8%D1%82%D0%B8%D0%BA%D0%B0
            - text: ":"
            - strong [ref=e1488]:
              - emphasis [ref=e1489]: "-m, -ś, -śmy, -ście"
            - text: . Это означает, что они имеют способность соединяться либо с самими глаголами, либо с первым словом в предложении. Это, кстати, объясняет и правило ударения, почему оно тут не на втором слоге с конца, а на третьем. Потому что оно должно сохраниться на том же месте, даже если окончание оторвется и пойдет приклеиваться к чему-нибудь другому =).
          - paragraph [ref=e1490]:
            - text: Поэтому можно сказать rob
            - strong [ref=e1491]: i
            - text: liśmy также иначе — m
            - strong [ref=e1492]: "y"
            - text: śmy rob
            - strong [ref=e1493]: i
            - text: li. А pis
            - strong [ref=e1494]: a
            - text: liście — w
            - strong [ref=e1495]: "y"
            - text: ście pis
            - strong [ref=e1496]: a
            - text: li. И так далее.
          - paragraph [ref=e1497]:
            - text: "Еще пример: классическое (по учебникам) Kiedy wyjechali"
            - strong [ref=e1498]: ście
            - text: "? превращается в Kiedy"
            - strong [ref=e1499]: ście
            - text: wyjechali?, что, кстати, с точки зрения «польского уха» — намного лучше звучит.
          - paragraph [ref=e1500]: "И еще примеры, где можно говорить и так, и так:"
          - list [ref=e1501]:
            - listitem [ref=e1502]: Dawno się nie widzieliśmy. = Dawnośmy się nie widzieli.
            - listitem [ref=e1503]: Jak się zmieniłeś przez te lata! = Jakeś się zmienił przez te lata!
          - paragraph [ref=e1504]: Важно отметить, что примеры после = (равно) всё-таки более разговорные, чем те, что перед = (равно). Иногда их даже принимают за диалект, что на самом деле не так. Но иметь в виду стоит. Потому что вам может попадаться любой из вариантов прошедшего времени, где будет окончание как с глаголом, так и с другим словом. Вам важно научиться определять, что это — именно прошедшее время, а не что-то другое.
