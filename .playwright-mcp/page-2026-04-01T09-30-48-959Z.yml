          - paragraph [ref=e252]: "В польской грамматике происхождение основы спряжения по лицам прошедшего времени объясняется долго и обстоятельно, и иностранцу знать это для письма и разговора, мне кажется, не стоит. Поэтому объясню так:"
          - list [ref=e253]:
            - listitem [ref=e254]:
              - text: Если
              - link "инфинитив" [ref=e255] [cursor=pointer]:
                - /url: https://pl.wikipedia.org/wiki/Bezokolicznik_w_j%C4%99zyku_polskim
              - text: (
              - link "безличный глагол" [ref=e256] [cursor=pointer]:
                - /url: https://pl.wikipedia.org/wiki/Bezokolicznik_w_j%C4%99zyku_polskim
              - text: ) заканчивается на -ć, то в большинстве случаев основой в прошедшем времени является часть инфинитива без последней буквы -ć. То есть, у инфинитива brać основой будет bra-, у czytać — czyta-, pływać — pływa-, chodzić — chodzi-, nosić — nosi-, tańczyć — tańczy-. Я написала «в большинстве», потому что не всегда. К примеру, такая простота характерна
              - link "третьему спряжению" [ref=e258] [cursor=pointer]:
                - /url: https://propolski.com/2015/12/21/koniugacja-3/
              - text: (кроме слова mieć),
              - generic [ref=e259]:
                - link "второму спряжению" [ref=e260] [cursor=pointer]:
                  - /url: https://propolski.com/2016/01/07/koniugacja-2/
                - text: на -ić/-yć/-ać,
              - generic [ref=e261]:
                - link "первому спряжению" [ref=e262] [cursor=pointer]:
                  - /url: https://propolski.com/2016/01/08/koniugacja-1/
                - text: на -ać/-ować/-iwać/-ywać/
              - text: и всех односложных глаголов первого спряжения на -ić/-yć/-uć.
            - listitem [ref=e263]: Окончания, выделенные красным цветом, ВСЕГДА одинаковы для прошедшего времени, любого слова. Любого. Без исключений.
          - heading "О -łom и -łoś, формы первого и второго лица среднего рода ед. числа" [level=3] [ref=e264]: О -łom и -łoś, формы первого и второго лица среднего рода ед. числа
          - paragraph [ref=e265]:
            - text: Формы первого и второго лица среднего рода обозначены светло-серым, как видите, потому что они очень редко употребляемы. Формы первого лица практически не существует, потому что предметы среднего рода не говорят, а младенцы, когда начинают говорить, сразу же употребляют женский или мужской род (niemowlę — в польском языке младенец — среднего рода, собственно, как и ребенок — dziecko). Однако в теории такие формы все же есть, и они могут быть употреблены в литературе. К примеру, если солнце (słońce) будет разговаривать, то оно может говорить о себе в первом лице — ja brałom. Чаще в литературе попадаются формы второго лица. Повторяю — в жизни и речи эти формы не употребляются и подчеркиваются автопроверкой. И еще раз об этом на польском читайте в
            - link "этой статье" [ref=e266] [cursor=pointer]:
              - /url: https://blog.dobryslownik.pl/sloneczko-wstalos-nie-zaspalom-o-tajemniczym-rodzaju-nijakim-czasownikow/
            - text: .
          - paragraph [ref=e267]: Что делать с остальными глаголами, которые мы не внесли в перечень, как с ними находить прошедшее время? Можно точно так же разделить их на подгруппы.
