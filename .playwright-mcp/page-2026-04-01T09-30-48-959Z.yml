                  - generic [ref=e1876]:
                    - paragraph [ref=e1877]:
                      - text: Никита, в Гугле миллионы страниц, и если эта в топе, то там после нее осталось еще миллион минус одна. Пожалуйста, махните мышкой и откройте какую-нибудь другую ссылку.
                      - text: Я пишу и структурирую так, как мне кажется удобным. И невозможно, чтобы этот способ подходил и нравился всем. Со временем некоторые статьи я переписываю и обновляю, если что-то мне кажется устаревшим или корявым. У меня нет редактора, который сразу же после публикации вычитывал бы все мои огрехи и корявости и добавлял ссылки на все определения.
                      - text: Я практически не добавляю их, так как это не труды, а мой личный блог. Я ни разу не филолог и не учитель польского. Я не копирую текст из книжек («любимых», и в Вашем комментарии эти кавычки кажутся оскорбительными), а пишу, исходя из опыта и прочитанного, используя максимально простые, на мой, конечно, взгляд, слова.
                      - text: Мне казались очевидными и простыми слова «регулярные и нерегулярные», так же, как «правильные и неправильные» для тех, кто изучает грамматику. Для Вас добавила ссылки на Википедию.
                      - text: Я не могу знать, сколько читателей не знают, что такое «лицо» в понятии грамматики, а сколько из них не знают, что такое, к примеру, «падеж». Идея добавлять на все такого рода определения хороша, и я делаю это в меру своих возможностей, но в 100% не считаю это возможным, так как это не Википедия, а блог. Данная статья была написана довольно давно и, возможно, ей в то время не было уделено столько внимания касательно определений, и никто не просил этого сделать до Вас. Вы попросили — я добавила. Про личные формы глагола — в какую статью нужно добавить ссылку на определение лица?
