          - heading "Заключение и итог" [level=2] [ref=e1513]: Заключение и итог
          - paragraph [ref=e1514]: "Тем, кто выдержал и дочитал до конца, скажу: «Спасибо! И — вы теперь наверняка лучше разобрались с прошедшим временем в польском». Я не писала слишком много примеров употребления здесь. Статья и так получилась слишком длинная (зато полная), и не хочется еще грузить ее примерами. Все просто, как в русском, только в русском говорим: «я был, ты был, он был», а в польском «ja byłem, ty byłeś, on był», в русском — «мы были, вы были, они были» — в польском «my byliśmy/byłyśmy, wy byliście/byłyście, oni byli/były». Анализируйте лицо, которое у вас выполняет действие, и ставьте правильную форму. Мне кажется, это очень просто. Если вы не согласны, и вам нужны примеры, пишите в комментариях, я сделаю P.S. к статье."
