              - generic [ref=e182]:
                - link "Катерина Лук'янова" [ref=e184] [cursor=pointer]:
                  - /url: https://propolski.com/
                - generic [ref=e185]: Здравствуйте.Меня зовут Екатерина Лукьянова, я - автор блога о польском языке ProPolski.com и сайта о Польше insidePL.com. Живу в Польше. Свободное от основной работы время всецело посвящаю ProPolski.com и insidePL.com.
          - paragraph [ref=e186]: Последнее обновление 6 февраля 2023
          - paragraph [ref=e187]: Я всегда пребывала в убеждении, что прошедшее время в польском языке имеет очень простые правила образования. Не пугайтесь, в основном так и есть, поскольку очень много общего есть между польским прошедшим и русским. Так-то оно так, но некоторые нюансы о нём всё-таки стоит знать.
          - insertion [ref=e188]
          - heading "Прошедшее время в польском языке" [level=2] [ref=e190]: Прошедшее время в польском языке
          - paragraph [ref=e191]: В моей любимой книге о грамматике Piotra Bąka настоящее время занимает шесть страниц, будущее полторы страницы, а вот прошедшее — целых шестнадцать…
          - blockquote [ref=e192]:
            - text: 💡
            - paragraph [ref=e193]:
              - strong [ref=e194]:
                - text: "Читайте также:"
                - 'link "Будущее время в польском языке: таблица, примеры, объяснение" [ref=e195] [cursor=pointer]':
                  - /url: https://propolski.com/2017/08/17/czas-przyszly/
          - paragraph [ref=e196]: Конечно, я прочла все эти шестнадцать страниц, и скажу, что вам они — совсем не нужны. Иностранцу, желающему научиться правильно говорить и писать, без надобности происхождение окончаний прошедшего времени, их связь с основами настоящего, деепричастиями и всяким таким прочим. Думаю, все это нужно оставить филологам. В этой статье мы с вами рассмотрим более практические и полезные примеры. Проще говоря — научимся творить прошедшее время польского языка и ставить правильно ударения (этот абзац — в самом конце статьи).
          - insertion [ref=e197]
