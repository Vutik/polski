            - text: Одной из проблем спряжений является то, что глаголы могут быть регулярными (правильными), то есть, спрягаться без каких-либо исключений и по правилам (и большинство глаголов — регулярные), а могут быть
            - link "нерегулярными" [ref=e201] [cursor=pointer]:
