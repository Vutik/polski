                - paragraph [ref=e1166]: Здравствуйте, большое Вам спасибо за предоставленные материалы. У меня вопрос касательно творительного падежа слова czosnek — czosnkiem, хотя логично было бы написать czosnekiem. Это слово-исключение или есть какое-то правило, почему именно такая форма? Заранее спасибо.
