          - paragraph [ref=e238]: На мой взгляд, исключений в падежах польского языка намного меньше, чем в русском языке. Есть, но правда, очень мало. И на «младших» уровнях языка практически не попадаются. Ниже будут приведены общие таблицы окончаний для всех падежей, существительных и прилагательных. Внимательно к ним присмотревшись, вы заметите, что многое очень сильно смахивает на русский, особенно если ориентироваться по примерам.
