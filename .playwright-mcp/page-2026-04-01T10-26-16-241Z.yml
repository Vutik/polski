          - paragraph [ref=e232]: Вынужденно написала в трёх языках для таких, как я — часто не могу вспомнить, как тот или иной падеж называется в русском, но помню в украинском, и наоборот. 🙂
          - paragraph [ref=e233]: "Зачем падежи вообще нужны? Как и в русском (украинском) языках, система падежей используется для того, чтобы установить правильные и гармоничные отношения между отдельными словами в предложении. В итоге мы получаем свободу в формировании последовательности слов в предложении: подлежащее, сказуемое и дополнение не имеют чётко установленных мест и могут следовать в любом порядке."
