                - generic [ref=e1183]:  7 января 2022 в 13:28
                - link " Постоянная ссылка" [ref=e1184] [cursor=pointer]:
                  - /url: https://propolski.com/2018/08/21/przypadki-polskie-liczba-pojedyncza/#comment-2774
              - generic [ref=e1185]:
                - paragraph [ref=e1186]: А как мне узнать, какое окончание ставить? Например слово brat. Да, правильно будет в родительном падеже brata, но почему не braty,bratu, brati. Как это можно узнать? Я смотрел на сайте turpl, но там сказано только про окончания a, u, но ничего нет про y, i.
                - link "Комментарий к записи Dude" [ref=e1187] [cursor=pointer]:
