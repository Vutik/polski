                - article [ref=e1190]:
                  - generic [ref=e1191]:
                    - generic [ref=e1192]:
                      - text: 
                      - link "Екатерина Лукьянова" [ref=e1193] [cursor=pointer]:
                        - /url: https://propolski.com/
                      - text: Автор записи
                    - generic [ref=e1194]:  10 января 2022 в 16:44
                    - link " Постоянная ссылка" [ref=e1195] [cursor=pointer]:
                      - /url: https://propolski.com/2018/08/21/przypadki-polskie-liczba-pojedyncza/#comment-2775
                  - generic [ref=e1196]:
                    - paragraph [ref=e1197]:
                      - text: Здравствуйте! В этой статье — общая таблица, без подробностей, как Вы видите. Я пишу отдельные статьи для каждого из спряжений, и там будет подробно для каждого окончания.
                      - text: "Вкратце: мужской род может, кроме согласных, также оканчиваться на гласную — tata, kolega, mężczyzna. Буквально выглядят как женские. Вот и применим к ним окончания как у женского родительного: taty, kolegi, mężczyzny."
                      - text: "Существительные мужского рода с окончанием на согласный: тут в родительном падеже ед. числа нужно определить, одушевленный или нет. Для одушевленных применяем окончание -а: brat — brata, kot — kota. А неодушевленные существительные могут иметь окончания -a или -u, и универсального правила тут практически нет, есть только некоторые наборы, которые можно заучить, где -a, а где -u. К примеру, дни недели — на -u: piątku, poniedziałku, а месяца — на -a: marca, kwietnia. С неодушевленным тут лучше всего работать со словарем, к примеру, Викисловарь:"
                      - link "https://propolski.com/2017/11/12/wikislownik-najlepszy-online-slownik-jezyka-polskiego/" [ref=e1198] [cursor=pointer]:
                        - /url: https://propolski.com/2017/11/12/wikislownik-najlepszy-online-slownik-jezyka-polskiego/
                      - text: Я очень надеюсь, что мне удастся вскоре опубликовать отдельные статьи по каждому падежу.
                    - link "Комментарий к записи Екатерина Лукьянова" [ref=e1199] [cursor=pointer]:
