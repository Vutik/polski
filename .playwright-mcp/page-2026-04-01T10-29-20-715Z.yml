                - strong [ref=e226]: "Падежи в польском языке: таблица окончаний единственного числа"
          - paragraph [ref=e227]: "Множественное число в польском языке, с одной стороны, простое, с другой — обладает некоторым количеством чередований. А точнее: четыре падежа — родительный, дательный, творительный и предложный — очень простые. Именительный — самый сложный, там много чередований и нюансов, нужно обращать внимание на ONI и ONE. Винительный уже не будет сложным, если выучите именительный и родительный. Звательный падеж — копия именительного."
