                  - text: в словах, основа которых заканчивается на мягкие согласные ć, ś, ź, dź .
                  - text: "Например: Nauczycielka – nauczycielki (учительница – учительницы); Noga – nogi (нога – ноги); Powieść – powieści (повесть – повести); Gęś – gęsi (гусь – гуси); Odpowiedź – odpowiedzi (ответ – ответы)."
                - paragraph [ref=e1048]:
                  - text: У вас в таблице окончание — е.
                  - text: Возможно я ошиблась????
                - link "Комментарий к записи Вероника" [ref=e1049] [cursor=pointer]:
                  - /url: "#comment-1935"
                  - text:  Ответ
