                      - text: в таблице есть, как k, g, c окончанием на -i, с которыми исключений мало (но есть, вроде ręka — ręce).
                    - paragraph [ref=e1070]: А еще есть fasola — fasole, но myśl — myśli, и много чего еще.
                    - paragraph [ref=e1071]: Всего-всего добавить в одну маааленькую табличку и так не получится, потому я базировалась на том, что более широко используется, на окончания большинства. Конечно же, в будущем будет отдельная статья для каждого падежа, и там уже будут, я надеюсь, все-все нюансы. 🙂
