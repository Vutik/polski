          - paragraph [ref=e589]:
            - text: Напоминаю про существительные среднего рода, которые заканчиваются на -um (
            - emphasis [ref=e590]: centrum
            - text: — центр,
            - emphasis [ref=e591]: muzeum
            - text: — музей,
            - emphasis [ref=e592]: audytorium
            - text: — аудитория,
            - emphasis [ref=e593]: dormitorium
            - text: — покои, комната в замке (в
            - link "Гарри Поттере" [ref=e594] [cursor=pointer]:
              - /url: https://propolski.com/2015/11/30/polski-z-harrym-potterem-czesc-1-1/
            - text: они там жили в таких),
            - emphasis [ref=e595]: liceum
            - text: — лицей,
            - emphasis [ref=e596]: gimnazjum
            - text: — гимназия,
            - emphasis [ref=e597]: technikum
            - text: — техникум,
            - emphasis [ref=e598]: imperium
            - text: — империя,
            - emphasis [ref=e599]: plenum
            - text: — пленум,
            - emphasis [ref=e600]: prezydium
            - text: — президиум и др., кроме
            - emphasis [ref=e601]: album
            - text: — альбом, это мужской род) и склоняются только во множественном числе. Я писала уже об этом в статье про
            - link "особенности склонения существительных" [ref=e602] [cursor=pointer]:
