                - generic [ref=e148]: Здравствуйте.Меня зовут Екатерина Лукьянова, я - автор блога о польском языке ProPolski.com и сайта о Польше insidePL.com. Живу в Польше. Свободное от основной работы время всецело посвящаю ProPolski.com и insidePL.com.
          - paragraph [ref=e149]: Последнее обновление 6 июля 2023
          - paragraph [ref=e150]:
            - text: Хорошая тема — существительные. И про
            - link "падежи" [ref=e151] [cursor=pointer]:
              - /url: https://propolski.com/2018/08/21/przypadki-polskie-liczba-pojedyncza/
            - text: уже немного рассказала, и про
            - link "особенности склонения" [ref=e152] [cursor=pointer]:
              - /url: https://propolski.com/2016/04/11/polskie-rzeczowniki-wyjatki/
            - text: . Вы уже знаете, что есть в польском языке существительные, которые вообще не склоняются, а есть такие, которые склоняются только во множественном числе.
          - paragraph [ref=e153]:
            - text: Существуют еще в польском языке существительные нерегулярные. Их нерегулярность, как правило, видна из их склонения. Некоторые вы даже знаете, возможно только не обращали внимания, что они какие-то не такие. Это слова вроде
            - strong [ref=e154]:
              - emphasis [ref=e155]: imię
            - text: (ед.ч.) —
            - strong [ref=e156]:
              - emphasis [ref=e157]: imiona
            - text: (мн.ч.),
