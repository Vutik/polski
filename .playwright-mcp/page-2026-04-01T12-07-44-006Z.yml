              - generic [ref=e1187]:
                - paragraph [ref=e1188]: А как мне узнать, какое окончание ставить? Например слово brat. Да, правильно будет в родительном падеже brata, но почему не braty,bratu, brati. Как это можно узнать? Я смотрел на сайте turpl, но там сказано только про окончания a, u, но ничего нет про y, i.
                - link "Комментарий к записи Dude" [ref=e1189] [cursor=pointer]:
